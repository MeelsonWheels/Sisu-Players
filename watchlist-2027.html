<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Watchlist 2027 | Sisu Sports Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14243B; --navy-2:#00366B; --yellow:#F4D450;
    --ink:#14243B; --muted:#5E6B7D; --line:#E3E7ED; --panel:#F5F7FA; --bg:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Poppins,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;border:1.5px solid currentColor;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:inherit;transition:.15s}
  .btn.solid{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
  .btn.solid:hover{filter:brightness(.95)}
  .btn.ghost:hover{background:rgba(255,255,255,.1)}
  .btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.dark:hover{background:var(--navy-2);border-color:var(--navy-2)}
  .btn svg{width:16px;height:16px}

  /* Hero */
  .hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border:60px solid rgba(244,212,80,.08);border-radius:50%}
  .hero .wrap{padding-top:64px;padding-bottom:64px;position:relative;z-index:1}
  .hero .eyebrow{color:var(--yellow)}
  .hero h1{font-size:clamp(32px,5.4vw,58px);line-height:1.05;margin:14px 0 14px;font-weight:700;letter-spacing:-.01em;text-transform:uppercase}
  .hero p.lead{font-size:17px;font-weight:300;max-width:620px;margin:0 0 26px;color:#DCE3EE}
  .trust{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:#B9C4D4;margin-bottom:30px}
  .trust span{display:inline-flex;align-items:center;gap:8px}
  .trust svg{width:14px;height:14px;color:var(--yellow)}
  .hero-actions{display:flex;flex-wrap:wrap;gap:12px}

  /* Sections */
  section.block{padding:56px 0}
  section.block.alt{background:var(--panel)}
  .sec-head{margin-bottom:26px}
  .sec-head .eyebrow{color:var(--navy-2)}
  .sec-head h2{font-size:clamp(24px,3.2vw,34px);margin:8px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:-.005em}
  .sec-head p{margin:0;color:var(--muted);max-width:640px}

  /* Window tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .tile{display:flex;flex-direction:column;justify-content:space-between;min-height:170px;padding:22px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);text-decoration:none;transition:.15s;position:relative}
  .tile:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,36,59,.08)}
  .tile .eyebrow{color:var(--muted);font-size:11px}
  .tile h3{margin:8px 0 0;font-size:22px;line-height:1.15;text-transform:uppercase}
  .tile .count{font-size:40px;font-weight:700;line-height:1;color:var(--navy)}
  .tile .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px}
  .tile .go{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center}
  .tile .go svg{width:14px;height:14px}
  .tile.feature{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tile.feature .eyebrow{color:var(--yellow)}
  .tile.feature .count{color:var(--yellow)}

  /* Position grid */
  .gender-row{margin-bottom:34px}
  .gender-row:last-child{margin-bottom:0}
  .gender-row h3{font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .gender-row h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .pos{display:flex;justify-content:space-between;align-items:center;padding:18px 18px;border-radius:12px;background:#fff;border:1px solid var(--line);text-decoration:none;transition:.15s}
  .pos:hover{border-color:var(--navy);background:#fff}
  .pos b{display:block;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
  .pos small{color:var(--muted);font-size:12px}
  .pos .n{font-size:24px;font-weight:700;color:var(--navy-2)}

  /* List view */
  .crumb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--yellow);margin-bottom:14px}
  .crumb svg{width:14px;height:14px}
  .list-hero .wrap{padding-top:44px;padding-bottom:40px}
  .list-hero h1{font-size:clamp(28px,4.4vw,46px);margin:10px 0 8px}
  .filters{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
  .filters .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-top:14px;padding-bottom:14px}
  .fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .fgroup label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--ink)}
  .chip:hover{border-color:var(--navy)}
  .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .search{flex:1;min-width:180px;max-width:280px;margin-left:auto;padding:9px 14px;border:1px solid var(--line);border-radius:999px;font:inherit;font-size:14px}
  .search:focus{outline:2px solid var(--navy-2);outline-offset:1px}
  .select,.num{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
  .select{padding-right:28px}
  .num{width:72px;text-align:center}
  .select:focus,.num:focus{outline:2px solid var(--navy-2);outline-offset:1px}
  .fgroup.age .dash{font-size:12px;color:var(--muted);margin:0 2px}
  .result-count{font-size:13px;color:var(--muted);margin:24px 0 14px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.15s}
  .card:hover{box-shadow:0 12px 28px rgba(20,36,59,.09);border-color:#cfd6e0}
  .card .top{background:var(--navy);color:#fff;padding:18px 18px 16px;position:relative;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
  .avatar{width:54px;height:54px;border-radius:50%;background:var(--navy-2);border:2px solid var(--yellow);display:grid;place-items:center;font-weight:600;font-size:18px;color:var(--yellow);letter-spacing:.02em}
  .badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:6px;background:rgba(255,255,255,.12);color:#fff}
  .badge.now{background:var(--yellow);color:var(--navy)}
  .badge.winter{background:#fff;color:var(--navy)}
  .badge.summer{background:rgba(244,212,80,.22);color:var(--yellow)}
  .card .top .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{margin:0;font-size:18px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em}
  .card h3 a{text-decoration:none}
  .card h3 a:hover{text-decoration:underline}
  .meta{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .meta strong{color:var(--ink);font-weight:500}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--panel);color:var(--navy-2);border:1px solid var(--line)}
  .card .actions{margin-top:auto;padding-top:6px}
  .link-arrow{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--navy-2)}
  .link-arrow svg{width:14px;height:14px}
  .link-arrow:hover{color:var(--navy)}
  .empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}

  /* Profile */
  .profile{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
  .profile .side{background:var(--navy);color:#fff;border-radius:var(--radius);padding:26px}
  .profile .side .avatar{width:96px;height:96px;font-size:32px;margin-bottom:18px}
  .profile .side h1{font-size:28px;line-height:1.1;margin:10px 0 6px;text-transform:uppercase}
  .profile .side p{margin:0;color:#C9D3E1;font-size:14px}
  .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
  .fact{padding:16px 18px;border-bottom:1px solid var(--line)}
  .fact:nth-child(odd){border-right:1px solid var(--line)}
  .fact dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
  .fact dd{margin:0;font-size:15px;font-weight:500}
  .detail{margin-top:22px}
  .phys-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .phys-tile{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px}
  .phys-tile span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C9D3E1}
  .phys-tile b{font-size:26px;color:var(--yellow)}
  .phys-table{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .phys-table table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
  .phys-table th{background:var(--panel);text-align:right;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;white-space:nowrap}
  .phys-table td{text-align:right;padding:9px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .phys-table th:first-child,.phys-table td:first-child{text-align:left}
  .phys-src{font-size:12px;color:var(--muted);margin:8px 0 0}
  @media (max-width:520px){ .phys-tiles{grid-template-columns:1fr} }
  .bio{margin:0;font-size:15px;line-height:1.65;max-width:68ch}
  .detail h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-2);margin:0 0 10px}
  .video-links{display:flex;flex-wrap:wrap;gap:8px}
  .btn.outline{color:var(--navy);border-color:var(--line);padding:9px 14px;font-size:12px}
  .btn.outline:hover{border-color:var(--navy)}
  .timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line);display:grid;gap:9px}
  .timeline li{position:relative;font-size:14px}
  .timeline li::before{content:"";position:absolute;left:-22px;top:7px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy-2)}
  .timeline li:first-child::before{background:var(--yellow);border-color:var(--navy)}
  .profile .note{font-size:13px;color:var(--muted);margin:14px 0 22px}

  /* CTA + contact */
  .cta{background:var(--navy);color:#fff;border-radius:20px;padding:40px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}
  .cta h2{font-size:clamp(22px,3vw,32px);margin:8px 0 10px;text-transform:uppercase}
  .cta p{margin:0;color:#C9D3E1}
  .cta .eyebrow{color:var(--yellow)}
  .cta ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:14px;color:#DCE3EE}
  .cta li{display:flex;gap:10px;align-items:center}
  .cta li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--yellow)}
  .cta .actions{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
  .contact{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center;padding:30px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
  .contact strong{color:var(--ink)}
  .disclaimer{font-size:12px;color:var(--muted);padding-bottom:30px}

  @media (max-width:900px){
    .tiles{grid-template-columns:1fr}
    .pos-grid{grid-template-columns:repeat(2,1fr)}
    .profile{grid-template-columns:1fr}
    .cta{grid-template-columns:1fr;padding:28px}
  }
  @media (max-width:520px){
    .wrap{padding:0 16px}
    .pos-grid{grid-template-columns:1fr}
    .facts{grid-template-columns:1fr}
    .fact:nth-child(odd){border-right:0}
    .search{max-width:none;margin-left:0}
    .hero .wrap{padding-top:44px;padding-bottom:44px}
  }
</style>
</head>

function windowOf(p){
  const c = p.contractEnd;
  if (!c) return "request";
  if (c === "free") return "now";
  const [y,m] = c.split("-").map(Number);
  const today = new Date(), ym = y*12 + (m-1), nowYm = today.getFullYear()*12 + today.getMonth();
  if (ym < nowYm) return "now";
  if (y === 2026 && m === 12) return "winter";
  if (y === 2027 && m <= 6) return "summer";
  if (ym === nowYm) return "now";
  return "request";
}

function groupOf(pos){
  const p = pos.toUpperCase();

  if (first === "GK") return "gk";
  if (/^(LB|RB|CB|LCB|RCB|LWB|RWB)$/.test(first)) return "def";

  return "fwd";
}

/* Age bounds: exact with a birthday, a one-year span with birth year only. */
function ageBounds(p){
  const a = age(p);

/* ---------- Helpers ---------- */
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
PLAYERS.forEach(p => { p.id = slug(p.name); p.window = windowOf(p); p.group = groupOf(p.position); p.profile = PROFILES[p.id] || {}; p.bio = BIOS[p.id] || ""; p.regions = regionsOf(p); });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = n => n.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0,2).join("").toUpperCase();
function age(p){
  if (p.birthday){
    const b = new Date(p.birthday + "T00:00:00"), t = new Date();
    let a = t.getFullYear() - b.getFullYear();
    if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
    return a;
  }
  return null;
}
function ageText(p){
  const a = age(p);
  if (a !== null) return a + " yrs";
  if (p.birthYear) return "Born " + p.birthYear;
  return null;
}
function fmtDate(iso){
  if (!iso) return null;
  return new Date(iso + "T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}
function fmtContract(p){
  if (!p.contractEnd) return null;
  if (p.contractEnd === "free") return "Free agent";
  const [y,m] = p.contractEnd.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
}

}
const shortlistLink = mailto("Tailored shortlist request",
  "Hello Sisu team,\n\nWe are recruiting and would like a tailored shortlist.\n\nMen's / Women's team:\nPosition:\nMarket / league:\nAge range:\nKey characteristics:\nBudget range:\nTransfer window:\nAdditional notes:\n\nClub:\nContact name:\nPhone / WhatsApp:");

const ICON = {
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
};

/* ---------- Routing (all views live on this one page) ---------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const [path, qs] = h.split("?");
  const parts = path.split("/").filter(Boolean);
  const q = Object.fromEntries(new URLSearchParams(qs || ""));
  return { parts, q };
}
function go(parts, q){
  const qs = q ? new URLSearchParams(Object.entries(q).filter(([,v]) => v && v !== "all")).toString() : "";
  location.hash = "#/" + parts.join("/") + (qs ? "?" + qs : "");
}
window.addEventListener("hashchange", () => render());

/* ---------- Shared blocks ---------- */
function trustLine(){
  return `<div class="trust">
    <span>${ICON.check} Direct agency contact</span>
    <span>${ICON.check} Player information checked before publication</span>
    <span>${ICON.check} Represented by Sisu Sports Management</span>
  </div>`;
}
function ctaBlock(title){
  return `<section class="block"><div class="wrap">
    <div class="cta">
      <div>
        <div class="eyebrow">Tailored shortlists</div>
        <h2>${esc(title || "Looking for a specific profile?")}</h2>
        <p>Tell us the position, market, key characteristics and budget. We will come back with players who fit, including profiles not listed here.</p>
        <div class="actions">
          <a class="btn solid" href="${shortlistLink}">${ICON.mail} Request a shortlist</a>
          <a class="btn ghost" href="#/list">Browse all players ${ICON.arrow}</a>
        </div>
      </div>
      <ul>
        <li>Men's and women's players</li>
        <li>Offices in the UK, USA, Australia, Ivory Coast and Nigeria</li>
        <li>Players across Europe, Africa, the Americas and Asia-Pacific</li>
      </ul>
    </div>
  </div></section>
  <div class="wrap">
    <div class="contact">
      <div><strong>Recruitment enquiries</strong><br>Sisu Sports Management</div>
      <div><a class="btn dark" href="mailto:${CONTACT_EMAIL}">${ICON.mail} ${CONTACT_EMAIL}</a></div>
    </div>
    <p class="disclaimer">Contract and availability information is indicative and confirmed with Sisu on enquiry. Player ages update automatically.</p>
  </div>`;
}
function card(p){
  const w = WINDOWS[p.window];
  const club = [p.club, p.clubCountry].filter(Boolean).join(" · ");
  const line1 = [p.position, ageText(p), p.profile.height ? p.profile.height + " cm" : null].filter(Boolean).join(" · ");
  const tags = [];
  if (p.nationalTeam) tags.push(p.nationalTeam + " international");
  if (p.profile.passport) tags.push(p.profile.passport);
  if (p.profile.video) tags.push("Video available");
  tags.push(p.gender === "W" ? "Women" : "Men");
  return `<article class="card">
    <div class="top">
      <div class="row">
        <div class="avatar" aria-hidden="true">${esc(initials(p.name))}</div>
        <span class="badge ${w.badge}">${esc(w.label)}</span>
      </div>
    </div>
    <div class="body">
      <h3><a href="#/player/${p.id}">${esc(p.name)}</a></h3>
      <div class="meta">
        <strong>${esc(line1)}</strong>
        ${club ? `<span>${esc(club)}</span>` : ""}
        <span>${esc(p.nationality)}</span>
      </div>
      <div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="actions"><a class="link-arrow" href="#/player/${p.id}">View full profile ${ICON.arrow}</a></div>
    </div>
  </article>`;
}

/* ---------- View: hub ---------- */
function viewHub(){
  const count = f => PLAYERS.filter(f).length;
  const tile = (k, feature) => {
    const w = WINDOWS[k];
    return `<a class="tile ${feature ? "feature" : ""}" href="#/list?win=${k}">
      <div><div class="eyebrow">Transfer window</div><h3>${esc(w.label)}</h3></div>
      <div class="foot"><span class="count">${count(p => p.window === k)}</span><span class="go">View players ${ICON.arrow}</span></div>
    </a>`;
  };
  const posRow = g => `<div class="gender-row">
      <h3>${g === "W" ? "Women" : "Men"}</h3>
      <div class="pos-grid">
        ${Object.values(POSITIONS).map(ps => `<a class="pos" href="#/list?g=${g}&pos=${ps.key}">
          <span><b>${ps.label}</b><small>${ps.short}</small></span>
          <span class="n">${count(p => p.gender === g && p.group === ps.key)}</span>
        </a>`).join("")}
      </div>
    </div>`;
  return `
  <header class="hero"><div class="wrap">
    <div class="eyebrow">Sisu Sports Management · 2027 Transfer Windows</div>
    <h1>Player Watchlist 2027</h1>
    <p class="lead">Selected Sisu-represented players for clubs recruiting in the Winter and Summer 2027 windows. Men's and women's football.</p>
    ${trustLine()}
    <div class="hero-actions">
      <a class="btn solid" href="#/list?win=winter">Free · Winter 2027 ${ICON.arrow}</a>
      <a class="btn ghost" href="#/list?win=summer">Contract ends · Summer 2027</a>
      <a class="btn ghost" href="#/list?win=now">Available now</a>
    </div>
  </div></header>

  <section class="block alt"><div class="wrap">
    <div class="sec-head">
      <div class="eyebrow">By window</div>
      <h2>When can they join?</h2>
      <p>Players grouped by when their current club contract ends.</p>
    </div>
    <div class="tiles">${tile("winter", true)}${tile("summer")}${tile("now")}</div>
  </div></section>

  <section class="block"><div class="wrap">
    <div class="sec-head">
      <div class="eyebrow">By position</div>
      <h2>Find the right profile faster</h2>
      <p>Browse the full Sisu list by position, then narrow by window.</p>
    </div>
    ${posRow("W")}
    ${posRow("M")}
  </div></section>

  ${ctaBlock()}`;
}

/* ---------- View: list ---------- */
function viewList(q){
  const g = q.g || "all", pos = q.pos || "all", win = q.win || "all", reg = q.reg || "all", s = (q.s || "").toLowerCase();
  const amin = q.amin ? Number(q.amin) : null, amax = q.amax ? Number(q.amax) : null;
  const ageOk = p => {
    if (amin === null && amax === null) return true;
    const b = ageBounds(p);
    if (!b) return false;
    return (amin === null || b[1] >= amin) && (amax === null || b[0] <= amax);
  };
  let list = PLAYERS.filter(p =>
    (g === "all" || p.gender === g) &&
    (pos === "all" || p.group === pos) &&
    (win === "all" || p.window === win) &&
    (reg === "all" || p.regions.includes(reg)) &&
    ageOk(p) &&
    (!s || [p.name, p.club, p.nationality, p.position, p.clubCountry].join(" ").toLowerCase().includes(s)));
  const order = { winter:0, summer:1, now:2, request:3 };
  list.sort((a,b) => order[a.window] - order[b.window] || a.group.localeCompare(b.group) || a.name.localeCompare(b.name));

  const titleParts = [];
  if (win !== "all") titleParts.push(WINDOWS[win].label);
  const heading = pos !== "all" ? POSITIONS[pos].label : "All players";
  const sub = [g === "W" ? "Women" : g === "M" ? "Men" : "Men & women", win !== "all" ? WINDOWS[win].short : "All windows"].join(" · ");
  const blurb = win !== "all" ? WINDOWS[win].blurb : "Every player currently on the Sisu watchlist.";

  const chips = (name, cur, opts) => `<div class="fgroup"><label>${name}</label>${
    opts.map(([v, l]) => `<button class="chip" data-f="${name.toLowerCase()}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div>`;

  return `
  <header class="hero list-hero"><div class="wrap">
    <a class="crumb" href="#/">${ICON.back} 2027 Watchlist</a>
    <div class="eyebrow">${esc(sub)}</div>
    <h1>${esc(heading)}</h1>
    <p class="lead">${esc(blurb)}</p>
  </div></header>
  <div class="filters"><div class="wrap">
    ${chips("Team", g, [["all","All"],["W","Women"],["M","Men"]])}
    ${chips("Position", pos, [["all","All"],["gk","GK"],["def","DEF"],["mid","MID"],["fwd","FWD"]])}
    ${chips("Window", win, [["all","All"],["winter","Winter 27"],["summer","Summer 27"],["now","Now"]])}
    <div class="fgroup"><label for="region">Region</label>
      <select id="region" class="select" data-q="reg" aria-label="Nationality region">
        <option value="all">All regions</option>
        ${Object.entries(REGIONS).map(([k, l]) => `<option value="${k}" ${reg === k ? "selected" : ""}>${l}</option>`).join("")}
      </select>
    </div>
    <div class="fgroup age"><label>Age</label>
      <input class="num" type="number" inputmode="numeric" min="14" max="45" placeholder="Min" value="${esc(q.amin || "")}" data-q="amin" aria-label="Minimum age">
      <span class="dash">to</span>
      <input class="num" type="number" inputmode="numeric" min="14" max="45" placeholder="Max" value="${esc(q.amax || "")}" data-q="amax" aria-label="Maximum age">
    </div>
    <input class="search" data-q="s" type="search" placeholder="Search name, club, country" value="${esc(q.s || "")}" aria-label="Search players">
  </div></div>
  <section><div class="wrap">
    <p class="result-count">${list.length} player${list.length === 1 ? "" : "s"}${
      reg !== "all" ? " · dual nationals appear under each of their regions" : ""}${
      amin !== null || amax !== null ? " · players without a recorded birth year are hidden while filtering by age" : ""}</p>
    ${list.length ? `<div class="cards">${list.map(card).join("")}</div>`
      : `<div class="empty">No players match these filters. <a href="${shortlistLink}">Ask us for a tailored shortlist</a>.</div>`}
  </div></section>
  ${ctaBlock("Looking for a different profile?")}`;
}

/* ---------- View: profile ---------- */
function physicalBlock(ph){
  const fmt = v => typeof v === "number" ? v.toLocaleString("en-GB") : esc(v);
  const peak = k => Math.max(...ph.weeks.map(w => w[k]));
  return `<div class="detail"><h3>Physical Data</h3>
    <div class="phys-tiles">
      <div class="phys-tile"><span>Peak Max Speed</span><b>${fmt(peak("max"))}</b></div>
      <div class="phys-tile"><span>Highest weekly Total Distance</span><b>${fmt(peak("td"))}</b></div>
      <div class="phys-tile"><span>Highest weekly Sprint Distance</span><b>${fmt(peak("spr"))}</b></div>
    </div>
    <div class="phys-table"><table>
      <thead><tr><th>Week</th>${ph.cols.map(([, l]) => `<th>${esc(l)}</th>`).join("")}</tr></thead>
      <tbody>${ph.weeks.map(w => `<tr><td>${w.wk}</td>${ph.cols.map(([k]) => `<td>${fmt(w[k])}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>
    <p class="phys-src">Source: ${esc(ph.source)}. HSR = high-speed running; HIACC / HIDEC = high-intensity accelerations / decelerations; ACC / DEC = accelerations / decelerations.</p>
  </div>`;
}
function detailBlocks(p){
  const pr = p.profile, out = [];
  if (p.bio) out.push(`<div class="detail"><h3>About</h3><p class="bio">${esc(p.bio)}</p></div>`);
  if (pr.fitness) out.push(`<div class="detail"><h3>Injury Status</h3><p class="bio">${esc(pr.fitness)}</p></div>`);
  if (pr.video && pr.video.length) out.push(`<div class="detail"><h3>Video</h3><div class="video-links">${
    pr.video.map(([l, u]) => `<a class="btn outline" href="${esc(u)}" target="_blank" rel="noopener">${ICON.play} ${esc(l)}</a>`).join("")}</div></div>`);
  if (pr.links && pr.links.length) out.push(`<div class="detail"><h3>External profiles</h3><div class="video-links">${
    pr.links.map(([l, u]) => `<a class="btn outline" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} ${ICON.arrow}</a>`).join("")}</div></div>`);
  if (pr.physical) out.push(physicalBlock(pr.physical));
  if (pr.skills && pr.skills.length) out.push(`<div class="detail"><h3>Strengths</h3><div class="tags">${
    pr.skills.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div></div>`);
  if (pr.achievements && pr.achievements.length) out.push(`<div class="detail"><h3>Honours</h3><ul class="timeline">${
    pr.achievements.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`);
  if (pr.history && pr.history.length) out.push(`<div class="detail"><h3>Career</h3><ul class="timeline">${
    pr.history.map(h => `<li>${esc(h)}</li>`).join("")}</ul></div>`);
  return out.join("");
}
function viewPlayer(id){
  const p = PLAYERS.find(x => x.id === id);
  if (!p) return `<section class="block"><div class="wrap"><div class="empty">Player not found. <a href="#/">Back to the watchlist</a></div></div></section>`;
  const w = WINDOWS[p.window];
  const facts = [
    ["Position", p.position],
    ["Age", age(p) !== null ? age(p) : null],
    ["Preferred foot", p.profile.foot],
    ["Height", p.profile.height ? p.profile.height + " cm" : null],
    ["Date of birth", p.birthday ? fmtDate(p.birthday) : (p.birthYear ? String(p.birthYear) : null)],
    ["Nationality", p.nationality],
    ["Passport", p.profile.passport],
    ["Region", p.regions.map(r => REGIONS[r]).join(" / ") || null],
    ["National team", p.nationalTeam],
    ["Current club", p.club],
    ["Club country", p.clubCountry],
    ["Club contract ends", fmtContract(p)],
    ["Availability", w.label],
    ["Team", p.gender === "W" ? "Women's football" : "Men's football"],
  ];
  const related = PLAYERS.filter(x => x.id !== p.id && x.gender === p.gender && x.group === p.group).slice(0, 3);
  return `
  <header class="hero list-hero"><div class="wrap">
    <a class="crumb" href="#/list?g=${p.gender}&pos=${p.group}">${ICON.back} ${esc(POSITIONS[p.group].label)} · ${p.gender === "W" ? "Women" : "Men"}</a>
  </div></header>
  <section class="block"><div class="wrap">
    <div class="profile">
      <aside class="side">
        <div class="avatar" aria-hidden="true">${esc(initials(p.name))}</div>
        <span class="badge ${w.badge}">${esc(w.label)}</span>
        <h1>${esc(p.name)}</h1>
        <p>${esc([p.position, ageText(p)].filter(Boolean).join(" · "))}</p>
        <div style="margin-top:22px"><a class="btn solid" href="${enquiryLink(p)}">${ICON.mail} Enquire</a></div>
      </aside>
      <div>
        <dl class="facts">
          ${facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v === null || v === undefined || v === "" ? '<span style="color:var(--muted)">On request</span>' : esc(v)}</dd></div>`).join("")}
        </dl>
        ${detailBlocks(p)}
        <p class="note">${esc(w.blurb)} ${p.profile.video ? "Further video" : "Video"}, physical data and references are available from the Sisu team.</p>
        <a class="btn dark" href="${enquiryLink(p)}">${ICON.mail} Request player information</a>
      </div>
    </div>
    ${related.length ? `<div style="margin-top:48px">
      <div class="sec-head"><div class="eyebrow">Similar profiles</div><h2>More ${esc(POSITIONS[p.group].label.toLowerCase())}</h2></div>
      <div class="cards">${related.map(card).join("")}</div>
    </div>` : ""}
  </div></section>
  ${ctaBlock()}`;
}

/* ---------- Render ---------- */
function render(keepScroll){
  const { parts, q } = parseHash();
  const app = document.getElementById("app");
  if (parts[0] === "list") app.innerHTML = viewList(q);
  else if (parts[0] === "player") app.innerHTML = viewPlayer(parts[1]);
  else app.innerHTML = viewHub();

  if (parts[0] === "list"){
    app.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      const key = { team:"g", position:"pos", window:"win" }[b.dataset.f];
      go(["list"], { ...q, [key]: b.dataset.v });
    }));
    const setQ = (key, value) => {
      history.replaceState(null, "", "#/list?" + new URLSearchParams(Object.entries({ ...q, [key]: value }).filter(([,v]) => v && v !== "all")));
    };
    app.querySelector(".select").addEventListener("change", e => { setQ("reg", e.target.value); render(true); });
    let t;
    app.querySelectorAll("input[data-q]").forEach(input => input.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const key = input.dataset.q;
        setQ(key, input.value.trim());
        const caret = input.type === "search" ? input.selectionStart : null;
        render(true);
        const ni = document.querySelector(`input[data-q="${key}"]`);
        ni.focus();
        if (caret !== null) ni.setSelectionRange(caret, caret);
      }, 350);
    }));
  }
  if (keepScroll !== true) window.scrollTo(0, 0);
}
render();
</script>
</body>
</html>

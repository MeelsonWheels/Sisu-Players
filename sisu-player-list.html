<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sisu Player List | Sisu Sports Management</title>
<meta name="description" content="Sisu-represented players available for the Winter and Summer 2027 transfer windows.">
<meta property="og:title" content="Sisu Player List | Sisu Sports Management">
<meta property="og:description" content="Sisu-represented players available for the Winter and Summer 2027 transfer windows.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14243B; --navy-2:#00366B; --yellow:#F4D450;
    --ink:#14243B; --muted:#5E6B7D; --line:#E3E7ED; --panel:#F5F7FA; --bg:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Poppins,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;border:1.5px solid currentColor;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:inherit;transition:.15s}
  .btn.solid{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
  .btn.solid:hover{filter:brightness(.95)}
  .btn.ghost:hover{background:rgba(255,255,255,.1)}
  .btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.dark:hover{background:var(--navy-2);border-color:var(--navy-2)}
  .btn svg{width:16px;height:16px}

  /* Hero */
  .hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border:60px solid rgba(244,212,80,.08);border-radius:50%}
  .hero .wrap{padding-top:64px;padding-bottom:64px;position:relative;z-index:1}
  .hero .eyebrow{color:var(--yellow)}
  .hero h1{font-size:clamp(32px,5.4vw,58px);line-height:1.05;margin:14px 0 14px;font-weight:700;letter-spacing:-.01em;text-transform:uppercase}
  .hero p.lead{font-size:17px;font-weight:300;max-width:620px;margin:0 0 26px;color:#DCE3EE}
  .trust{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:#B9C4D4;margin-bottom:30px}
  .trust span{display:inline-flex;align-items:center;gap:8px}
  .trust svg{width:14px;height:14px;color:var(--yellow)}
  .hero-actions{display:flex;flex-wrap:wrap;gap:12px}

  /* Sections */
  section.block{padding:56px 0}
  section.block.alt{background:var(--panel)}
  .sec-head{margin-bottom:26px}
  .sec-head .eyebrow{color:var(--navy-2)}
  .sec-head h2{font-size:clamp(24px,3.2vw,34px);margin:8px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:-.005em}
  .sec-head p{margin:0;color:var(--muted);max-width:640px}

  /* Window tiles */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .tile{display:flex;flex-direction:column;justify-content:space-between;min-height:170px;padding:22px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);text-decoration:none;transition:.15s;position:relative}
  .tile:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,36,59,.08)}
  .tile .eyebrow{color:var(--muted);font-size:11px}
  .tile h3{margin:8px 0 0;font-size:22px;line-height:1.15;text-transform:uppercase}
  .tile .count{font-size:40px;font-weight:700;line-height:1;color:var(--navy)}
  .tile .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px}
  .tile .go{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center}
  .tile .go svg{width:14px;height:14px}
  .tile.feature{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tile.feature .eyebrow{color:var(--yellow)}
  .tile.feature .count{color:var(--yellow)}

  /* Position grid */
  .gender-row{margin-bottom:34px}
  .gender-row:last-child{margin-bottom:0}
  .gender-row h3{font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .gender-row h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .pos{display:flex;justify-content:space-between;align-items:center;padding:18px 18px;border-radius:12px;background:#fff;border:1px solid var(--line);text-decoration:none;transition:.15s}
  .pos:hover{border-color:var(--navy);background:#fff}
  .pos b{display:block;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
  .pos small{color:var(--muted);font-size:12px}
  .pos .n{font-size:24px;font-weight:700;color:var(--navy-2)}

  /* List view */
  .crumb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--yellow);margin-bottom:14px}
  .crumb svg{width:14px;height:14px}
  .list-hero .wrap{padding-top:44px;padding-bottom:40px}
  .list-hero h1{font-size:clamp(28px,4.4vw,46px);margin:10px 0 8px}
  .filters{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
  .filters .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-top:14px;padding-bottom:14px}
  .fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .fgroup label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--ink)}
  .chip:hover{border-color:var(--navy)}
  .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .search{flex:1;min-width:180px;max-width:280px;margin-left:auto;padding:9px 14px;border:1px solid var(--line);border-radius:999px;font:inherit;font-size:14px}
  .search:focus{outline:2px solid var(--navy-2);outline-offset:1px}
  .select,.num{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
  .select{padding-right:28px}
  .num{width:72px;text-align:center}
  .select:focus,.num:focus{outline:2px solid var(--navy-2);outline-offset:1px}
  .fgroup.age .dash{font-size:12px;color:var(--muted);margin:0 2px}
  .result-count{font-size:13px;color:var(--muted);margin:24px 0 14px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.15s}
  .card:hover{box-shadow:0 12px 28px rgba(20,36,59,.09);border-color:#cfd6e0}
  .card .top{background:var(--navy);color:#fff;padding:18px 18px 16px;position:relative;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
  .avatar{width:54px;height:54px;border-radius:50%;background:var(--navy-2);border:2px solid var(--yellow);display:grid;place-items:center;font-weight:600;font-size:18px;color:var(--yellow);letter-spacing:.02em}
  .badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:6px;background:rgba(255,255,255,.12);color:#fff}
  .badge.winter{background:var(--yellow);color:var(--navy)}
  .badge.summer{background:rgba(244,212,80,.22);color:var(--yellow)}
  .card .top .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{margin:0;font-size:18px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em}
  .card h3 a{text-decoration:none}
  .card h3 a:hover{text-decoration:underline}
  .meta{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .meta strong{color:var(--ink);font-weight:500}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--panel);color:var(--navy-2);border:1px solid var(--line)}
  .card .actions{margin-top:auto;padding-top:6px}
  .link-arrow{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--navy-2)}
  .link-arrow svg{width:14px;height:14px}
  .link-arrow:hover{color:var(--navy)}
  .empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}

  /* Profile */
  .profile{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
  .profile > *{min-width:0}
  .profile .side{background:var(--navy);color:#fff;border-radius:var(--radius);padding:26px}
  .profile .side .avatar{width:96px;height:96px;font-size:32px;margin-bottom:18px}
  .profile .side h1{font-size:28px;line-height:1.1;margin:10px 0 6px;text-transform:uppercase}
  .profile .side p{margin:0;color:#C9D3E1;font-size:14px}
  .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
  .fact{padding:16px 18px;border-bottom:1px solid var(--line)}
  .fact:nth-child(odd){border-right:1px solid var(--line)}
  .fact dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
  .fact dd{margin:0;font-size:15px;font-weight:500}
  .detail{margin-top:22px}
  .phys-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .phys-tile{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px}
  .phys-tile span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C9D3E1}
  .phys-tile b{font-size:26px;color:var(--yellow)}
  .phys-table{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .phys-table table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
  .phys-table th{background:var(--panel);text-align:right;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;white-space:nowrap}
  .phys-table td{text-align:right;padding:9px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .phys-table th:first-child,.phys-table td:first-child{text-align:left}
  .phys-table th:nth-child(2),.phys-table td:nth-child(2){text-align:left}
  .phys-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .phys-stat{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
  .phys-stat span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .phys-stat b{font-size:18px;color:var(--navy)}
  .mp-period{font-size:13px;color:var(--muted);margin:0 0 10px}
  .mp-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:#fff}
  .radar{width:100%;height:auto;display:block}
  .radar .rg{fill:none;stroke:var(--line);stroke-width:1}
  .radar .ra{stroke:var(--line);stroke-width:1}
  .radar .rp{fill:rgba(0,54,107,.18);stroke:var(--navy-2);stroke-width:2}
  .radar .rd{fill:var(--yellow);stroke:var(--navy);stroke-width:1.5}
  .radar .rl{font-size:13px;fill:var(--muted);font-family:Poppins,Arial,sans-serif}
  .radar .rv{font-weight:700;fill:var(--navy);font-size:14px}
  .radar .rs{font-size:9.5px;fill:#9AA5B5;font-family:Poppins,Arial,sans-serif}
  .mp-head{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
  .mp-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .mp-row:last-child{border-bottom:0}
  .mp-row b{color:var(--navy);font-variant-numeric:tabular-nums}
  @media (max-width:900px){ .mp-grid{grid-template-columns:1fr} }
  .perf-season + .perf-season{margin-top:20px}
  .perf-season h4{margin:0 0 8px;font-size:14px;font-weight:600}
  .phys-src{font-size:12px;color:var(--muted);margin:8px 0 0}
  @media (max-width:520px){ .phys-tiles{grid-template-columns:1fr} }
  .headline{margin:-4px 0 0;font-size:12.5px;font-weight:600;color:var(--navy-2);text-transform:uppercase;letter-spacing:.04em;line-height:1.35}
  .profile .side .side-headline{margin-top:14px;color:var(--yellow);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;line-height:1.4}
  .bio{margin:0;font-size:15px;line-height:1.65;max-width:68ch}
  .detail h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-2);margin:0 0 10px}
  .video-links{display:flex;flex-wrap:wrap;gap:8px}
  .btn.outline{color:var(--navy);border-color:var(--line);padding:9px 14px;font-size:12px}
  .btn.outline:hover{border-color:var(--navy)}
  .timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line);display:grid;gap:9px}
  .timeline li{position:relative;font-size:14px}
  .timeline li::before{content:"";position:absolute;left:-22px;top:7px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy-2)}
  .timeline li:first-child::before{background:var(--yellow);border-color:var(--navy)}
  .profile .note{font-size:13px;color:var(--muted);margin:14px 0 22px}

  /* CTA + contact */
  .cta{background:var(--navy);color:#fff;border-radius:20px;padding:40px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}
  .cta h2{font-size:clamp(22px,3vw,32px);margin:8px 0 10px;text-transform:uppercase}
  .cta p{margin:0;color:#C9D3E1}
  .cta .eyebrow{color:var(--yellow)}
  .cta ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:14px;color:#DCE3EE}
  .cta li{display:flex;gap:10px;align-items:center}
  .cta li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--yellow)}
  .cta .actions{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
  .contact{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center;padding:30px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
  .contact strong{color:var(--ink)}
  .modal-back{position:fixed;inset:0;background:rgba(20,36,59,.55);display:grid;place-items:center;z-index:50;padding:16px}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:26px;position:relative}
  .modal .eyebrow{color:var(--navy-2)}
  .modal h2{margin:6px 0 16px;font-size:24px;text-transform:uppercase}
  .modal-x{position:absolute;top:12px;right:14px;border:0;background:none;font-size:28px;line-height:1;color:var(--muted);cursor:pointer}
  .enq{display:grid;gap:12px}
  .enq label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
  .enq input,.enq textarea{font:inherit;font-size:14px;font-weight:400;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  .enq input:focus,.enq textarea:focus{outline:2px solid var(--navy-2);outline-offset:1px}
  .enq-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .enq .enq-consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:12.5px;color:var(--ink)}
  .enq .enq-consent input{width:auto;margin-top:3px}
  .enq .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .enq-msg{margin:0;font-size:13px;color:#B42318;min-height:18px}
  .enq-done{font-size:15px;margin:6px 0}
  .enq button[type=submit]{justify-self:start}
  .cookie-bar{position:fixed;left:16px;right:16px;bottom:16px;z-index:40;background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:900px;margin:0 auto}
  .cookie-bar p{margin:0;font-size:13px;flex:1;min-width:240px;color:#DCE3EE}
  .cookie-bar a{color:var(--yellow)}
  .cookie-bar div{display:flex;gap:8px}
  .cookie-bar .light-btn{color:#fff;border-color:rgba(255,255,255,.5)}
  @media (max-width:520px){ .enq-row{grid-template-columns:1fr} }
  .disclaimer{font-size:12px;color:var(--muted);padding-bottom:30px}

  @media (max-width:900px){
    .tiles{grid-template-columns:1fr}
    .pos-grid{grid-template-columns:repeat(2,1fr)}
    .profile{grid-template-columns:1fr}
    .cta{grid-template-columns:1fr;padding:28px}
  }
  @media (max-width:520px){
    .wrap{padding:0 16px}
    .pos-grid{grid-template-columns:1fr}
    .facts{grid-template-columns:1fr}
    .fact:nth-child(odd){border-right:0}
    .search{max-width:none;margin-left:0}
    .hero .wrap{padding-top:44px;padding-bottom:44px}
  }
</style>
</head>

const POSITIONS = {
  gk:  { key:"gk",  label:"Goalkeepers", short:"GK" },

  mid: { key:"mid", label:"Midfielders", short:"Holding, central & attacking" },
  fwd: { key:"fwd", label:"Wingers & Forwards", short:"Wide players & strikers" },
};
function groupOf(pos){
  const p = pos.toUpperCase();
  const first = p.split(/[\/ ]/)[0];
  if (first === "GK") return "gk";
  if (/^(LB|RB|CB|LCB|RCB|LWB|RWB)$/.test(first)) return "def";
  if (/^(DM|CM|AM|CAM|CDM|LM|RM)$/.test(first)) return "mid";
  return "fwd";
}
// Every group a player's listed positions cover, e.g. "CB/CM" is a defender and a midfielder.
function groupsOf(pos){
  const out = new Set([groupOf(pos)]);
  pos.toUpperCase().split(/[\/\s(),]+/).forEach(t => {
    if (t === "GK" || t === "GOALKEEPER") out.add("gk");
    else if (/^(LB|RB|CB|LCB|RCB|LWB|RWB)$/.test(t)) out.add("def");
    else if (/^(DM|CM|AM|CAM|CDM|LM|RM)$/.test(t)) out.add("mid");
    else if (/^(LW|RW|ST|CF|SS|W|FORWARD|WINGER|STRIKER)$/.test(t)) out.add("fwd");
  });
  return [...out];
}

  const q = Object.fromEntries(new URLSearchParams(qs || ""));

}

}

function radarSVG(rates){
  const n = rates.length, W = 600, H = 400, cx = W / 2, cy = H / 2 + 4, R = 130;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const ring = f => rates.map((_, i) => pt(i, R * f).join(",")).join(" ");
  const shape = rates.map(([, v], i) => pt(i, R * Math.max(v, 0) / 100).join(",")).join(" ");
  const labels = rates.map(([l, v], i) => {
    const [x, y] = pt(i, R + 22), anchor = Math.abs(x - cx) < 8 ? "middle" : x > cx ? "start" : "end";
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="rl"><tspan class="rv">${v}%</tspan><tspan x="${x.toFixed(1)}" dy="13">${esc(l)}</tspan></text>`;
  }).join("");
  return `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Performance profile radar">
    ${[0.25, 0.5, 0.75, 1].map(f => `<polygon points="${ring(f)}" class="rg"/>`).join("")}
    ${rates.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="ra"/>`; }).join("")}
    <text x="${cx + 3}" y="${(cy - R * 0.5 + 3).toFixed(1)}" class="rs">50%</text>
    <polygon points="${shape}" class="rp"/>
    ${rates.map(([, v], i) => { const [x, y] = pt(i, R * v / 100); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" class="rd"/>`; }).join("")}
    ${labels}
  </svg>`;
}
function matchProfileBlock(m){
  const d = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { month:"short", year:"numeric" });
  const per90 = (v, k) => { const x = v / m.minutes * 90; return x.toFixed(k === "xG (expected goals)" ? 2 : x < 10 ? 1 : 0); };
  const pos = Object.entries(m.positions).map(([k, c]) => `${k} ×${c}`).join(", ");
  const SHOW = [["Goals","Goals"],["Shots","Shots"],["xG (expected goals)","xG"],["Chances created","Chances created"],["Key passes","Key passes"],["Passes","Passes"],["Progressive passes","Progressive passes"],["Challenges","Duels"],["Tackles","Tackles"],["Interceptions","Interceptions"],["Loose ball recoveries","Ball recoveries"]];
  const stats = SHOW.filter(([k]) => m.counts[k] !== undefined);
  return `<div class="detail"><h3>Performance Profile</h3>
    <p class="mp-period">${d(m.from)} – ${d(m.to)} · ${m.matches} matches · ${m.minutes.toLocaleString("en-GB")} minutes · Positions: ${esc(pos)}</p>

      </div>
    </div>
    <p class="phys-src">Source: ${esc(m.source)}, ${d(m.from)} – ${d(m.to)}. The radar shows the player’s own success rates (0–100%) in these matches, each based on at least 10 attempts. It is not a comparison with other players.</p>
  </div>`;
}
function performanceBlock(seasons){

function detailBlocks(p){

/* ---------- Render ---------- */
function render(keepScroll){
  const { parts, q } = parseHash();
  if (keepScroll !== true) track(parts[0] === "player" ? "player" : parts[0] === "list" ? "list" : "home", parts[1]);
  const app = document.getElementById("app");
  if (parts[0] === "list") app.innerHTML = viewList(q);
  else if (parts[0] === "player") app.innerHTML = viewPlayer(parts[1]);
  else app.innerHTML = viewHub();

  if (parts[0] === "list"){
    app.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      const key = { team:"g", position:"pos", window:"win" }[b.dataset.f];
      go(["list"], { ...q, [key]: b.dataset.v });
    }));
    const setQ = (key, value) => {
      history.replaceState(null, "", "#/list?" + new URLSearchParams(Object.entries({ ...q, [key]: value }).filter(([,v]) => v && v !== "all")));
    };
    app.querySelector(".select").addEventListener("change", e => { setQ("reg", e.target.value); render(true); });
    let t;
    app.querySelectorAll("input[data-q]").forEach(input => input.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const key = input.dataset.q;
        setQ(key, input.value.trim());
        const caret = input.type === "search" ? input.selectionStart : null;
        render(true);
        const ni = document.querySelector(`input[data-q="${key}"]`);
        ni.focus();
        if (caret !== null) ni.setSelectionRange(caret, caret);
      }, 350);
    }));
  }
  if (keepScroll !== true) window.scrollTo(0, 0);
}
/* ---------- Analytics, enquiries and consent ---------- */
const API_BASE = /\.vercel\.app$/.test(location.hostname) ? "" : "https://sisu-players.vercel.app";
// Microsoft Clarity project ID (public, not a secret). Empty = heat maps off and no cookie banner.
const CLARITY_ID = "";

// Counts a view only for a real, visible browser that stays on the view for a moment,
// which leaves out crawlers, link previews and email scanners.
let trackTimer;
function track(type, player){
  clearTimeout(trackTimer);
  if (navigator.webdriver || /bot|crawl|spider|headless|lighthouse|preview/i.test(navigator.userAgent)) return;
  trackTimer = setTimeout(() => { if (document.visibilityState === "visible") sendTrack(type, player); }, 1500);
}
function sendTrack(type, player){
  try {
    const data = JSON.stringify({ type, player: player || null });
    const url = API_BASE + "/api/track";
    if (!(navigator.sendBeacon && navigator.sendBeacon(url, new Blob([data], { type: "application/json" }))))
      fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: data, keepalive: true }).catch(() => {});
  } catch {}
}

        <label>Email*<input name="email" type="email" required maxlength="200" autocomplete="email"></label></div>
      <div class="enq-row"><label>Club / organisation<input name="club" maxlength="160" autocomplete="organization"></label>
        <label>Role<input name="role" maxlength="120"></label></div>
      <label>Message<textarea name="message" rows="4" maxlength="2000" placeholder="${p ? "What would you like to know?" : "Position, market, age range, budget, window"}"></textarea></label>
      <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
      <label class="enq-consent"><input type="checkbox" name="consent" required> I agree that Sisu Sports Management may use these details to reply to my enquiry. <a href="https://www.sisusportsmanagement.com/privacy-policy" target="_blank" rel="noopener">Privacy policy</a></label>
      <p class="enq-msg" role="status"></p>
      <button class="btn dark" type="submit">${ICON.mail} Send enquiry</button>
    </form></div>`;
  document.body.appendChild(wrap);
  const close = () => { wrap.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  wrap.addEventListener("click", e => { if (e.target === wrap) close(); });
  wrap.querySelector(".modal-x").onclick = close;
  const form = wrap.querySelector("form"), msg = wrap.querySelector(".enq-msg");
  form.querySelector("input[name=name]").focus();
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    if (!f.name.trim() || !/^\S+@\S+\.\S+$/.test(f.email.trim())) { msg.textContent = "Please add your name and a valid email."; return; }
    if (!form.consent.checked) { msg.textContent = "Please tick the box so we can reply."; return; }
    const btn = form.querySelector("button[type=submit]"); btn.disabled = true; msg.textContent = "Sending…";
    try {
      const r = await fetch(API_BASE + "/api/enquiry", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...f, consent: true, player: p ? p.id : "", playerName: p ? p.name : "" }) });
      if (!r.ok) throw new Error();
      form.innerHTML = `<p class="enq-done">Thank you. Your enquiry has been sent to the Sisu team, who will reply by email.</p>`;
    } catch {
      btn.disabled = false;
      msg.innerHTML = `Sorry, that didn't send. Please <a href="${fallback}">email us directly</a>.`;
    }
  });
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-enquire]");
  if (a) { e.preventDefault(); enquiryModal(a.dataset.enquire); return; }
  if (e.target.closest("[data-cookie-settings]")) { e.preventDefault(); consentBanner(true); }
});

function loadClarity(){
  if (!CLARITY_ID || window.clarity) return;
  (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, "clarity", "script", CLARITY_ID);
  window.clarity("consent");
}
function consentBanner(force){
  if (!CLARITY_ID) return;
  let choice = null;
  try { choice = localStorage.getItem("sisuCookieChoice"); } catch {}
  if (choice === "accept" && !force) return loadClarity();
  if (choice === "decline" && !force) return;
  document.querySelector(".cookie-bar")?.remove();
  const bar = document.createElement("div");
  bar.className = "cookie-bar";
  bar.innerHTML = `<p>We'd like to use Microsoft Clarity cookies to see how this page is used (heat maps). You can say no and the page works the same. <a href="https://www.sisusportsmanagement.com/privacy-policy" target="_blank" rel="noopener">Privacy policy</a></p>
    <div><button class="btn light-btn" data-c="decline">Decline</button><button class="btn solid" data-c="accept">Accept</button></div>`;
  document.body.appendChild(bar);
  bar.addEventListener("click", e => {
    const c = e.target.closest("[data-c]")?.dataset.c; if (!c) return;
    try { localStorage.setItem("sisuCookieChoice", c); } catch {}
    bar.remove();
    if (c === "accept") loadClarity();
    else if (window.clarity) location.reload();
  });
}
consentBanner();

render();
</script>
</body>
</html>
